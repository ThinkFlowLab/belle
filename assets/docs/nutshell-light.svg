<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="532" viewBox="0 0 1060 532" role="img" aria-label="Belle in a nutshell. Chat platforms (Slack, and the experimental Discord, Mattermost and Matrix) connect to Belle, which decides when to speak and handles boundaries, tools, memory and background work. Belle runs on one harness at a time: JiuwenSwarm, or the experimental OpenCode v2, Docker Agent or ACP. The harness calls a chat model, and Belle calls task models for decisions, summaries, extraction and classification. Platforms, harness and models are each replaceable."><title>Belle in a nutshell. Chat platforms (Slack, and the experimental Discord, Mattermost and Matrix) connect to Belle, which decides when to speak and handles boundaries, tools, memory and background work. Belle runs on one harness at a time: JiuwenSwarm, or the experimental OpenCode v2, Docker Agent or ACP. The harness calls a chat model, and Belle calls task models for decisions, summaries, extraction and classification. Platforms, harness and models are each replaceable.</title><style>@keyframes back90-5_62{0%{stroke-dashoffset:-90}5.62%,100%{stroke-dashoffset:18}}@keyframes out90-4_38{0%{stroke-dashoffset:18}4.38%,100%{stroke-dashoffset:-90}}@keyframes out62-3_75{0%{stroke-dashoffset:18}3.75%,100%{stroke-dashoffset:-62}}@keyframes back62-3_75{0%{stroke-dashoffset:-62}3.75%,100%{stroke-dashoffset:18}}@keyframes back90-4_38{0%{stroke-dashoffset:-90}4.38%,100%{stroke-dashoffset:18}}@keyframes out583-6_88{0%{stroke-dashoffset:18}6.88%,100%{stroke-dashoffset:-583}}@keyframes back583-6_88{0%{stroke-dashoffset:-583}6.88%,100%{stroke-dashoffset:18}}@keyframes out90-5_62{0%{stroke-dashoffset:18}5.62%,100%{stroke-dashoffset:-90}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs></defs><rect x="0.5" y="0.5" width="1059" height="531" rx="12" fill="#f9fafc" stroke="#d9dbde"/><text x="120.0" y="36.0" text-anchor="middle" font-family="'IBM Plex Sans',system-ui,-apple