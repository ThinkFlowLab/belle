[package]
name = "belle-matrix-helper"
version = "1.0.0"
edition = "2021"
publish = false
description = "Belle's Matrix client: sync, encryption and media through matrix-rust-sdk, over a JSON-lines socket on fd 3"
license = "Apache-2.0"

[dependencies]
matrix-sdk = { version = "=0.19.1", default-features = false, features = ["e2e-encryption", "sqlite", "automatic-room-key-forwarding", "rustls-aws-lc-rs"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "signal", "sync", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
futures-util = "0.3"
mime = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
strip = true
